<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f5c48"/>
      <stop offset="1" stop-color="#1f4234"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="98" fill="none" stroke="#173328" stroke-width="4"/>

  <!-- classroom grid, like chalk lines on a board -->
  <g stroke="#eef2ea" stroke-opacity="0.22" stroke-width="6">
    <line x1="150" y1="120" x2="150" y2="392"/>
    <line x1="256" y1="120" x2="256" y2="392"/>
    <line x1="362" y1="120" x2="362" y2="392"/>
    <line x1="120" y1="180" x2="392" y2="180"/>
    <line x1="120" y1="256" x2="392" y2="256"/>
    <line x1="120" y1="332" x2="392" y2="332"/>
  </g>

  <!-- chalk stick, seen from the side, tucked against the pin -->
  <g transform="rotate(-30 206 250)">
    <rect x="150" y="242" width="66" height="17" rx="8.5" fill="#f6f2e6"/>
    <line x1="158" y1="246" x2="200" y2="246" stroke="#d8d2c2" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- pin marking a found room -->
  <path d="M256 118c-42 0-76 34-76 76 0 57 76 148 76 148s76-91 76-148c0-42-34-76-76-76z"
        fill="#5b8cff"/>
  <circle cx="256" cy="194" r="30" fill="#1f4234"/>

  <!-- big graduation cap, near-black so it pops off the green board even at tiny sizes -->
  <g transform="rotate(-6 256 96)">
    <ellipse cx="256" cy="120" rx="48" ry="24" fill="#10131a"/>
    <polygon points="256,52 338,94 256,136 174,94" fill="#10131a"/>
    <circle cx="256" cy="94" r="7" fill="#f6f2e6"/>
    <path d="M256 94 q48 16 52 58 q3 24 -16 34" fill="none" stroke="#f6f2e6" stroke-width="9" stroke-linecap="round"/>
    <circle cx="292" cy="196" r="13" fill="#f6f2e6"/>
  </g>

  <!-- magnifying glass, searching -->
  <circle cx="352" cy="352" r="54" fill="none" stroke="#f6f2e6" stroke-width="20"/>
  <line x1="391" y1="391" x2="432" y2="432" stroke="#f6f2e6" stroke-width="22" stroke-linecap="round"/>
</svg>
